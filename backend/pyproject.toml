[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "integration: marks tests as integration (requires running Postgres)",
    "slow: marks tests as slow",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "S", "C4", "T20"]
ignore = ["S101", "S104"]

[tool.ruff.lint.per-file-ignores]
# CLI tools legitimately need to print to stdout.
"contact_ops/agents/cli.py" = ["T201"]
# Test fixtures + tests can re-export and use leading-underscore helpers.
"tests/**" = ["F401"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
no_implicit_reexport = true
disallow_untyped_defs = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]

# Third-party libraries without type stubs.
[[tool.mypy.overrides]]
module = [
    "celery",
    "celery.*",
    "scipy",
    "scipy.*",
    "prometheus_client",
    "opentelemetry",
    "opentelemetry.*",
    # Phase 3.2 Voice Match: ML libs without bundled stubs.
    "torch",
    "pyannote",
    "pyannote.*",
    "modelscope",
    "modelscope.*",
    "pgvector",
    "pgvector.*",
]
ignore_missing_imports = true
