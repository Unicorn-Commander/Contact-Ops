# Contact-Ops stranger/self-host quickstart.
#
# This file is intentionally independent from the production cell compose:
# every service is on one private network, the three application ports bind to
# loopback only, and Keycloak is provisioned locally before the API starts.
# The README quickstart is the supported invocation for this file.
name: contact-ops

x-backend-image: &backend-image
  build:
    context: ./backend
    dockerfile: Dockerfile
  image: contact-ops-backend:selfhost

services:
  contact-ops-postgres:
    image: pgvector/pgvector:pg16
    container_name: contact-ops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: contact_ops_admin
      POSTGRES_DB: contact_ops_db
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD}
      CO_RUNTIME_PASSWORD: ${CO_RUNTIME_PASSWORD}
    volumes:
      - contact-ops-pgdata:/var/lib/postgresql/data
      - ./deploy/selfcontained/initdb:/docker-entrypoint-initdb.d:ro
    networks: [contact-ops-internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contact_ops_admin -d contact_ops_db"]
      interval: 5s
      timeout: 5s
      retries: 30

  contact-ops-redis:
    image: redis:7-alpine
    container_name: contact-ops-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - contact-ops-redis:/data
    networks: [contact-ops-internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  contact-ops-falkordb:
    image: falkordb/falkordb:latest
    container_name: contact-ops-falkordb
    restart: unless-stopped
    volumes:
      - contact-ops-falkordb:/data
    networks: [contact-ops-internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  contact-ops-qdrant:
    image: qdrant/qdrant:latest
    container_name: contact-ops-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - contact-ops-qdrant:/qdrant/storage
    networks: [contact-ops-internal]

  contact-ops-garage:
    image: dxflrs/garage:v1.0.1
    container_name: contact-ops-garage
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
    volumes:
      - contact-ops-garage-meta:/var/lib/garage/meta
      - contact-ops-garage-data:/var/lib/garage/data
      - ./deploy/selfcontained/garage.toml:/etc/garage.toml:ro
    networks: [contact-ops-internal]

  # The browser resolves contact-ops.localhost to loopback, while the backend
  # reaches this service through the same hostname on the private network.
  # Keeping one issuer URL preserves browser OIDC and JWT validation parity.
  contact-ops-keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: contact-ops-keycloak
    restart: unless-stopped
    command: ["start", "--http-enabled=true", "--http-port=8080"]
    environment:
      KC_DB: postgres
      KC_DB_URL: ${CONTACT_OPS_DATABASE_URL}
      # Keep Keycloak in PostgreSQL's existing default schema. The bundled
      # database init creates the application roles, but not a second schema;
      # using public keeps a fresh box self-contained without a manual SQL step.
      KC_DB_SCHEMA: public
      KC_DB_USERNAME: contact_ops_admin
      KC_DB_PASSWORD: ${PG_ADMIN_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASS}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: http://contact-ops.localhost:8080
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      contact-ops-internal:
        aliases:
          - contact-ops.localhost
    depends_on:
      contact-ops-postgres:
        condition: service_healthy
  # Creates the realm contract and the generated first admin before the API can
  # accept traffic. The script retries Keycloak authentication while it starts.
  contact-ops-keycloak-bootstrap:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: contact-ops-keycloak-bootstrap
    restart: "no"
    depends_on:
      contact-ops-keycloak:
        condition: service_started
    volumes:
      - ./scripts/keycloak_bootstrap.sh:/opt/contact-ops/keycloak_bootstrap.sh:ro
    environment:
      KC_SERVER_URL: http://contact-ops-keycloak:8080
      KC_REALM: ${KEYCLOAK_REALM}
      KC_ADMIN_USER: ${KC_ADMIN_USER}
      KC_ADMIN_PASS: ${KC_ADMIN_PASS}
      KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME}
      KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD}
      KEYCLOAK_SWITCH_CLIENT_SECRET: ${KEYCLOAK_SWITCH_CLIENT_SECRET}
      APP_ORIGIN: ${APP_ORIGIN}
      MCP_ORIGIN: ${MCP_ORIGIN}
      CARDDAV_ORIGIN: ${MCP_ORIGIN}
      DEV_ORIGIN: ${APP_ORIGIN}
      SIGNUP_ENABLED: ${SIGNUP_ENABLED}
    entrypoint: ["/bin/bash", "/opt/contact-ops/keycloak_bootstrap.sh"]
    networks: [contact-ops-internal]

  # Migrations run once with the BYPASSRLS database role. seed_rls_probes
  # creates or finds the two strict probe tenants the runtime role's boot
  # self-test requires (rls-probe-a / rls-probe-b, or the legacy
  # selfhost-probe-* rows). They contain no customer data. The printed ids are
  # the well-known values already set in the self-contained env template.
  contact-ops-db-bootstrap:
    <<: *backend-image
    container_name: contact-ops-db-bootstrap
    restart: "no"
    env_file: [.env]
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL}
      SEED_OWNER_USER_ID: ${SEED_OWNER_USER_ID}
    depends_on:
      contact-ops-postgres:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        alembic upgrade head
        python -m contact_ops.ops.seed_rls_probes

  contact-ops-backend:
    <<: *backend-image
    container_name: contact-ops-backend
    restart: unless-stopped
    env_file: [.env]
    environment:
      STANDALONE_MODE: "false"
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      contact-ops-postgres:
        condition: service_healthy
      contact-ops-redis:
        condition: service_healthy
      contact-ops-db-bootstrap:
        condition: service_completed_successfully
      contact-ops-keycloak-bootstrap:
        condition: service_completed_successfully
    networks: [contact-ops-internal]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8501/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  contact-ops-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_MCP_BASE_URL: ${MCP_ORIGIN}
        VITE_KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID}
        VITE_PROJECTS_BASE_URL: ${VITE_PROJECTS_BASE_URL}
        VITE_UMAMI_SRC: ${VITE_UMAMI_SRC}
        VITE_UMAMI_WEBSITE_ID: ${VITE_UMAMI_WEBSITE_ID}
        VITE_POSTHOG_KEY: ${VITE_POSTHOG_KEY}
        VITE_POSTHOG_HOST: ${VITE_POSTHOG_HOST}
    container_name: contact-ops-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      contact-ops-backend:
        condition: service_healthy
    networks: [contact-ops-internal]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  contact-ops-internal:
    name: contact-ops-selfhost-internal

volumes:
  contact-ops-pgdata:
  contact-ops-redis:
  contact-ops-falkordb:
  contact-ops-qdrant:
  contact-ops-garage-meta:
  contact-ops-garage-data:
