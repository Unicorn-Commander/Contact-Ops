# Contact-Ops CI Pipeline — Woodpecker CI
# Targets unicorn-woodpecker-server on centerdeep

when:
  - branch: main
  - branch: "[0-9]*"
  - branch: track-*
  - event: tag

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: woodpecker
      POSTGRES_PASSWORD: woodpecker
      POSTGRES_DB: contact_ops_test

volumes:
  - name: pip-cache
    path: /cache
    mount: /cache

steps:
  # ------------------------------------------------------------------
  # 1. Lint — ruff
  # ------------------------------------------------------------------
  lint:
    image: python:3.12-slim-bookworm
    commands:
      - pip install --no-cache-dir ruff==0.11.8
      - ruff check backend/contact_ops/
    environment:
      PIP_CACHE_DIR: /cache

  # ------------------------------------------------------------------
  # 2. Typecheck — mypy strict
  # ------------------------------------------------------------------
  typecheck:
    image: python:3.12-slim-bookworm
    commands:
      - pip install --no-cache-dir mypy==1.16.1 pydantic sqlalchemy
      - pip install --no-cache-dir -r backend/requirements.txt 2>&1 || true
      - mypy --strict backend/contact_ops/ || true
    environment:
      PIP_CACHE_DIR: /cache

  # ------------------------------------------------------------------
  # 3. Migration roundtrip test
  # ------------------------------------------------------------------
  migration-test:
    image: python:3.12-slim-bookworm
    commands:
      - apt-get update && apt-get install -y --no-install-recommends postgresql-client 2>&1 >/dev/null
      - until pg_isready -h postgres -U woodpecker -d contact_ops_test; do sleep 2; done
      - pip install --no-cache-dir -r backend/requirements.txt
      - cd backend && alembic upgrade head && alembic downgrade base && alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://woodpecker:woodpecker@postgres:5432/contact_ops_test
      MIGRATION_DATABASE_URL: ${CONTACT_OPS_DATABASE_URL}
      PIP_CACHE_DIR: /cache

  # ------------------------------------------------------------------
  # 4. Tests
  # ------------------------------------------------------------------
  test:
    image: python:3.12-slim-bookworm
    commands:
      - apt-get update && apt-get install -y --no-install-recommends postgresql-client docker.io 2>&1 >/dev/null
      - until pg_isready -h postgres -U woodpecker -d contact_ops_test; do sleep 2; done
      - pip install --no-cache-dir -r backend/requirements.txt
      - pip install --no-cache-dir -r backend/requirements-dev.txt
      - cd backend && pytest tests/ -v --tb=short
    environment:
      DATABASE_URL: postgresql+asyncpg://woodpecker:woodpecker@postgres:5432/contact_ops_test
      MIGRATION_DATABASE_URL: ${CONTACT_OPS_DATABASE_URL}
      STANDALONE_MODE: "false"
      ENV: test
      PIP_CACHE_DIR: /cache

  # ------------------------------------------------------------------
  # 5. Security scan (bandit)
  # ------------------------------------------------------------------
  security-scan:
    image: python:3.12-slim-bookworm
    commands:
      - pip install --no-cache-dir bandit==1.8.2
      - bandit -r backend/contact_ops/ -x backend/contact_ops/tests/ || true
    environment:
      PIP_CACHE_DIR: /cache

  # ------------------------------------------------------------------
  # 5b. Dependency CVE audit — Python (pip-audit)
  # ------------------------------------------------------------------
  # Pre-contract diligence (task 4b69e281): scan the pinned backend deps for
  # known CVEs. Two passes:
  #   * advisory   — always prints EVERY known advisory, never fails the build.
  #   * gate       — fails on any advisory NOT in the triaged baseline below, so
  #                  a NEW vulnerability (including any new HIGH) breaks CI while
  #                  the already-triaged set stays green.
  #
  # TRIAGE 2026-07-18 (CVSS v3.1 base) — the HIGH (>=7.0) findings still open:
  #   pyjwt 2.10.1            PYSEC-2026-120/179 (7.5/7.4), PYSEC-2025-183 (7.0)  -> fix pyjwt>=2.13.0
  #   python-multipart 0.0.29 PYSEC-2026-3036 (7.5)                               -> fix >=0.0.31
  #   cryptography 48.0.0     GHSA-537c-gmf6-5ccf (7.5, bundled OpenSSL)          -> fix >=48.0.1
  #   starlette 1.0.1         PYSEC-2026-249/2281 (7.5)                           -> fix >=1.3.1
  #   ecdsa 0.19.2            PYSEC-2026-1325 (7.4, Minerva timing)              -> NO FIX (upstream wontfix; via python-jose)
  # Remediation for the fixable HIGHs is a `pip-compile` lockfile bump (all deps
  # are hash-pinned in requirements.txt) + a full test run — tracked as a
  # dedicated dependency-bump task, NOT this fence. Refresh the baseline below
  # once that lands so the fixed advisories are removed from the ignore list.
  dep-audit-python:
    image: python:3.12-slim-bookworm
    commands:
      - pip install --no-cache-dir pip-audit==2.10.1
      # Advisory: full report of every known advisory (informational only).
      - pip-audit -r backend/requirements.txt --desc || true
      # Gate: fail on anything NOT in the triaged baseline (new vulns break CI).
      - >
        pip-audit -r backend/requirements.txt
        --ignore-vuln PYSEC-2026-2338
        --ignore-vuln GHSA-537c-gmf6-5ccf
        --ignore-vuln PYSEC-2026-1325
        --ignore-vuln GHSA-4xgf-cpjx-pc3j
        --ignore-vuln PYSEC-2026-120
        --ignore-vuln PYSEC-2025-183
        --ignore-vuln PYSEC-2026-179
        --ignore-vuln PYSEC-2026-175
        --ignore-vuln PYSEC-2026-177
        --ignore-vuln PYSEC-2026-178
        --ignore-vuln PYSEC-2026-176
        --ignore-vuln PYSEC-2026-3037
        --ignore-vuln PYSEC-2026-3036
        --ignore-vuln PYSEC-2026-3040
        --ignore-vuln PYSEC-2026-248
        --ignore-vuln PYSEC-2026-249
        --ignore-vuln PYSEC-2026-2281
        --ignore-vuln PYSEC-2026-2280
    environment:
      PIP_CACHE_DIR: /cache

  # ------------------------------------------------------------------
  # 5c. Dependency CVE audit — Frontend (npm audit, prod deps only)
  # ------------------------------------------------------------------
  # Scans production dependencies (--omit=dev) against the npm advisory DB.
  # Advisory pass surfaces everything; the gate fails on HIGH+ (native flag).
  # Current state (2026-07-18): 0 vulnerabilities.
  dep-audit-frontend:
    image: node:20-bookworm-slim
    commands:
      - cd frontend
      - npm audit --omit=dev || true
      - npm audit --omit=dev --audit-level=high

  # ------------------------------------------------------------------
  # 6. Docker build + push (on tag)
  # ------------------------------------------------------------------
  docker-build:
    image: docker:28
    privileged: true
    commands:
      - docker build -t git.unicorncommander.ai/aaron/contact-ops:$CI_COMMIT_TAG -f backend/Dockerfile backend/
      - echo "$REGISTRY_PASSWORD" | docker login git.unicorncommander.ai -u "$REGISTRY_USER" --password-stdin
      - docker push git.unicorncommander.ai/aaron/contact-ops:$CI_COMMIT_TAG
    when:
      event: tag
    secrets:
      - registry_user
      - registry_password
