<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none" color="#19c37d" role="img" aria-label="Contact-Ops mark, one color">
  <title>Contact-Ops — one color</title>
  <!-- Single-color mark. Inherits `color`; set it (or currentColor) to stamp in any one ink. -->
  <g stroke="currentColor" stroke-width="3" stroke-linecap="round">
    <line x1="52" y1="60" x2="64" y2="24"/><line x1="52" y1="60" x2="97" y2="46"/><line x1="52" y1="60" x2="91" y2="85"/>
    <line x1="52" y1="60" x2="55" y2="101"/><line x1="52" y1="60" x2="20" y2="41"/>
    <line x1="64" y1="24" x2="97" y2="46" stroke-width="2.4"/><line x1="91" y1="85" x2="55" y2="101" stroke-width="2.4"/>
    <line x1="20" y1="41" x2="64" y2="24" stroke-width="2.4"/>
  </g>
  <g fill="currentColor">
    <circle cx="64" cy="24" r="7.6"/><circle cx="97" cy="46" r="7.0"/><circle cx="91" cy="85" r="6.6"/>
    <circle cx="55" cy="101" r="6.6"/><circle cx="20" cy="41" r="6.6"/>
  </g>
  <!-- anchor: ring + core so the human hub stays distinct without color -->
  <circle cx="52" cy="60" r="12.4" fill="currentColor"/>
  <circle cx="52" cy="60" r="5.4" fill="#070b09"/>
</svg>
