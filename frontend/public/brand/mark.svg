<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Contact-Ops">
  <title>Contact-Ops</title>
  <defs>
    <!-- emerald -> spring mint, diagonal across the whole mark so the network reads as one piece -->
    <linearGradient id="co-edge" x1="14" y1="100" x2="100" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0e9f6e"/>
      <stop offset="0.55" stop-color="#19c37d"/>
      <stop offset="1" stop-color="#5ef2b3"/>
    </linearGradient>
    <radialGradient id="co-node" cx="0.36" cy="0.30" r="0.85">
      <stop offset="0" stop-color="#7ff5c4"/>
      <stop offset="0.45" stop-color="#19c37d"/>
      <stop offset="1" stop-color="#0c8a60"/>
    </radialGradient>
    <radialGradient id="co-anchor" cx="0.36" cy="0.30" r="0.9">
      <stop offset="0" stop-color="#ffe2ad"/>
      <stop offset="0.45" stop-color="#ffb454"/>
      <stop offset="1" stop-color="#f0901f"/>
    </radialGradient>
    <filter id="co-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>

    <!-- geometry defined once, painted twice (soft glow underlay + crisp top) -->
    <g id="co-net">
      <g stroke="url(#co-edge)" stroke-width="2.6" stroke-linecap="round" fill="none" opacity="0.92">
        <!-- hub edges: the anchor (the person) to everyone they know -->
        <line x1="52" y1="60" x2="64" y2="24"/>
        <line x1="52" y1="60" x2="97" y2="46"/>
        <line x1="52" y1="60" x2="91" y2="85"/>
        <line x1="52" y1="60" x2="55" y2="101"/>
        <line x1="52" y1="60" x2="20" y2="41"/>
        <!-- cross links: relationships know each other (it is a graph, not a list) -->
        <line x1="64" y1="24" x2="97" y2="46" stroke-width="2.0" opacity="0.7"/>
        <line x1="91" y1="85" x2="55" y2="101" stroke-width="2.0" opacity="0.7"/>
        <line x1="20" y1="41" x2="64" y2="24" stroke-width="2.0" opacity="0.7"/>
      </g>
      <!-- satellite nodes (the people in the network) -->
      <g stroke="#5ef2b3" stroke-width="1.4">
        <circle cx="64" cy="24" r="7.6" fill="url(#co-node)"/>
        <circle cx="97" cy="46" r="7.0" fill="url(#co-node)"/>
        <circle cx="91" cy="85" r="6.6" fill="url(#co-node)"/>
        <circle cx="55" cy="101" r="6.6" fill="url(#co-node)"/>
        <circle cx="20" cy="41" r="6.6" fill="url(#co-node)"/>
      </g>
      <!-- the anchor: the human at the heart of the graph -->
      <circle cx="52" cy="60" r="12.4" fill="url(#co-anchor)" stroke="#fff0d6" stroke-width="1.6"/>
    </g>
  </defs>

  <use href="#co-net" filter="url(#co-glow)" opacity="0.85"/>
  <use href="#co-net"/>
</svg>
