<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Contact-Ops — Canonical contact registry by Magic Unicorn" />
    <meta name="theme-color" content="#8b5cf6" />
    <meta property="og:title" content="Contact-Ops" />
    <meta property="og:description" content="Canonical contact registry by Magic Unicorn" />
    <meta property="og:type" content="website" />
    <title>Contact-Ops — Magic Unicorn</title>
    <script>
      // Apply the resolved theme before first paint to avoid a flash of the
      // wrong color scheme. Mirrors getThemePreference()/applyThemePreference()
      // in src/design-system/tokens.ts. Does not persist — only an explicit
      // toggle writes localStorage.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var prefersDark =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme =
            stored === "light" || stored === "dark" ? stored : prefersDark ? "dark" : "light";
          var root = document.documentElement;
          root.dataset.theme = theme;
          root.classList.toggle("dark", theme === "dark");
          root.classList.toggle("light", theme === "light");
          root.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
