<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Contact-Ops: relationship intelligence you self-host. Your contacts as a living knowledge graph you own, part of the Unicorn Commander suite." />
    <meta name="theme-color" content="#19c37d" />
    <meta property="og:title" content="Contact-Ops" />
    <meta property="og:description" content="Relationship intelligence you self-host. Your contacts as a living graph you own." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Contact-Ops</title>
    <script>
      // Apply the resolved theme before first paint to avoid a flash of the
      // wrong color scheme. Mirrors getThemePreference()/applyThemePreference()
      // in src/design-system/tokens.ts. Does not persist — only an explicit
      // toggle writes localStorage.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var prefersDark =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme =
            stored === "light" || stored === "dark" ? stored : prefersDark ? "dark" : "light";
          var root = document.documentElement;
          root.dataset.theme = theme;
          root.classList.toggle("dark", theme === "dark");
          root.classList.toggle("light", theme === "light");
          root.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
