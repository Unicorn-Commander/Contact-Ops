server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # TLS is terminated at Traefik and proxied to nginx over http, so nginx's
    # own scheme is "http". Emit RELATIVE Location headers (e.g. "/welcome/")
    # for all redirects so the browser keeps the original https scheme instead
    # of being downgraded to http on the front-door 302.
    absolute_redirect off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;

    # Backend health remains available for operators; container health uses nginx-health.
    location /health {
        proxy_pass http://contact-ops-backend:8501/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Nginx-only health for container checks
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # API proxy to backend
    location /api/ {
        proxy_pass http://contact-ops-backend:8501/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-User $http_x_forwarded_user;
        proxy_set_header Authorization $http_authorization;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }

    # Proxy OpenAPI docs to backend
    location /docs {
        proxy_pass http://contact-ops-backend:8501/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://contact-ops-backend:8501/redoc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://contact-ops-backend:8501/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Static assets with caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Public front door: the bare domain serves the marketing / product page.
    # Exact-match ("= /") so it ONLY catches the root — /people, /assets/, /api/,
    # and the /auth/callback OAuth code-exchange all fall through to the SPA and
    # are untouched. Logged-in users are one silent-SSO click from the app.
    location = / {
        return 302 /welcome/;
    }

    # SPA shell - never cache index.html so new deploys land on a normal refresh
    # (hashed files under /assets/ stay immutable and content-addressed).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
