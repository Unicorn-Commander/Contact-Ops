# Contact-Ops - Production Docker Compose
# OAuth2 Proxy with Keycloak OIDC authentication
# Routes: mcp.contacts.magicunicorn.dev (backend API) + OAuth2 proxy for web UI

services:
  contact-ops-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: contact-ops-backend
    restart: unless-stopped
    expose:
      - "8501"
    env_file:
      - .env
    environment:
      - STANDALONE_MODE=false
    networks:
      - unicorn-network
      - web
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.contact-ops-mcp.rule=Host(`mcp.contacts.magicunicorn.dev`)"
      - "traefik.http.routers.contact-ops-mcp.entrypoints=websecure"
      - "traefik.http.routers.contact-ops-mcp.tls=true"
      - "traefik.http.routers.contact-ops-mcp.tls.certresolver=letsencrypt"
      - "traefik.http.services.contact-ops-mcp.loadbalancer.server.port=8501"
      - "traefik.docker.network=web"

  contact-ops-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: contact-ops-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - unicorn-network
      - web
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'

  oauth2-proxy-contact-ops:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
    container_name: oauth2-proxy-contact-ops
    restart: unless-stopped
    expose:
      - "4180"
    networks:
      - unicorn-network
      - web
    environment:
      - OAUTH2_PROXY_PROVIDER=oidc
      - OAUTH2_PROXY_OIDC_ISSUER_URL=https://auth.unicorncommander.ai/realms/uchub
      - OAUTH2_PROXY_CLIENT_ID=contact-ops-mcp
      - OAUTH2_PROXY_CLIENT_SECRET=${OAUTH2_PROXY_CLIENT_SECRET}
      - OAUTH2_PROXY_REDIRECT_URL=https://contacts.magicunicorn.dev/oauth2/callback

      - OAUTH2_PROXY_COOKIE_SECRET=${OAUTH2_COOKIE_SECRET}
      - OAUTH2_PROXY_COOKIE_DOMAINS=.magicunicorn.dev
      - OAUTH2_PROXY_COOKIE_SECURE=true
      - OAUTH2_PROXY_COOKIE_SAMESITE=lax
      - OAUTH2_PROXY_COOKIE_NAME=_oauth2_proxy_contact_ops
      - OAUTH2_PROXY_COOKIE_EXPIRE=168h
      - OAUTH2_PROXY_COOKIE_REFRESH=1h

      - OAUTH2_PROXY_UPSTREAMS=http://contact-ops-frontend:80
      - OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4180

      - OAUTH2_PROXY_EMAIL_DOMAINS=*
      - OAUTH2_PROXY_PASS_USER_HEADERS=true
      - OAUTH2_PROXY_SET_XAUTHREQUEST=true
      - OAUTH2_PROXY_PASS_ACCESS_TOKEN=true

      - OAUTH2_PROXY_SKIP_AUTH_ROUTES=^/api/.*,^/health.*,^/docs.*,^/redoc.*,^/openapi\.json$,^/assets/.*,^/static/.*,^/favicon\.ico$,^/manifest\.json$

      - OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER=true
      - OAUTH2_PROXY_SKIP_AUTH_STRIP_HEADERS=false

      - OAUTH2_PROXY_SILENCE_PING_LOGGING=true
      - OAUTH2_PROXY_SKIP_PROVIDER_BUTTON=true
      - OAUTH2_PROXY_REVERSE_PROXY=true

      - OAUTH2_PROXY_SESSION_STORE_TYPE=cookie

      - OAUTH2_PROXY_OIDC_EMAIL_CLAIM=email
      - OAUTH2_PROXY_OIDC_GROUPS_CLAIM=groups
      - OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL=true

      - OAUTH2_PROXY_EXTRA_JWT_ISSUERS=https://auth.unicorncommander.ai/realms/uchub=contact-ops
    healthcheck:
      test: ["CMD", "/bin/oauth2-proxy", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.contact-ops-web.rule=Host(`contacts.magicunicorn.dev`)"
      - "traefik.http.routers.contact-ops-web.entrypoints=websecure"
      - "traefik.http.routers.contact-ops-web.tls=true"
      - "traefik.http.routers.contact-ops-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.contact-ops-web.loadbalancer.server.port=4180"
      - "traefik.docker.network=web"

networks:
  unicorn-network:
    external: true
  web:
    external: true
