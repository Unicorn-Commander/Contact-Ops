# Contact-Ops - Development Docker Compose
# STANDALONE_MODE=true for local development without OAuth2
# docker compose up spins a working Postgres + backend locally

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: contact-ops-postgres-dev
    environment:
      POSTGRES_USER: contact_ops_dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: contact_ops_db_dev
    ports:
      - "5432:5432"
    volumes:
      - contact-ops-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contact_ops_dev -d contact_ops_db_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  migration:
    image: python:3.12-slim-bookworm
    container_name: contact-ops-migration-dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://contact_ops_dev:dev@postgres:5432/contact_ops_db_dev
      MIGRATION_DATABASE_URL: ${CONTACT_OPS_DATABASE_URL}
    volumes:
      - ./backend:/app:ro
    working_dir: /app
    command: >
      bash -c "
        pip install --no-cache-dir alembic sqlalchemy[asyncio] asyncpg pgvector 2>&1 >/dev/null
        && alembic upgrade head
      "

  contact-ops-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: contact-ops-backend
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      DATABASE_URL: postgresql+asyncpg://contact_ops_dev:dev@postgres:5432/contact_ops_db_dev
      STANDALONE_MODE: "true"
      ENV: dev
    depends_on:
      migration:
        condition: service_completed_successfully
    networks:
      - unicorn-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  contact-ops-frontend:
    image: nginx:alpine
    container_name: contact-ops-frontend
    restart: unless-stopped
    ports:
      - "8502:80"
    volumes:
      - ./frontend/build:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - unicorn-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'

networks:
  unicorn-network:
    external: true

volumes:
  contact-ops-pgdata:
