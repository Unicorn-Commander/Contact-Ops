# Center Deep Data Intel - Development Docker Compose
# STANDALONE_MODE=true for local development without OAuth2

services:
  dataintel-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dataintel-backend
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      # Hot reload for development
      - ./backend/app:/app/app:ro
    networks:
      - unicorn-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  dataintel-frontend:
    image: nginx:alpine
    container_name: dataintel-frontend
    restart: unless-stopped
    ports:
      - "8502:80"
    volumes:
      - ./frontend/build:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - unicorn-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'

networks:
  unicorn-network:
    external: true
