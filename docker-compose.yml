# Contact-Ops - Development Docker Compose
# STANDALONE_MODE=true for local development without OAuth2
# docker compose up spins a working Postgres + backend locally

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: contact-ops-postgres-dev
    environment:
      POSTGRES_USER: contact_ops_dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: contact_ops_db_dev
    ports:
      - "5432:5432"
    volumes:
      - contact-ops-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contact_ops_dev -d contact_ops_db_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis is the Celery broker AND the circuit-breaker / cost-burn cache.
  # In production this lives on ``unicorn-redis``; locally we run a tiny
  # container so docker compose up brings the whole fleet substrate alive.
  redis:
    image: redis:7-alpine
    container_name: contact-ops-redis-dev
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - contact-ops-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migration:
    image: python:3.12-slim-bookworm
    container_name: contact-ops-migration-dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://contact_ops_dev:dev@postgres:5432/contact_ops_db_dev
      MIGRATION_DATABASE_URL: ${CONTACT_OPS_DATABASE_URL}
    volumes:
      - ./backend:/app:ro
    working_dir: /app
    command: >
      bash -c "
        pip install --no-cache-dir alembic sqlalchemy[asyncio] asyncpg pgvector 2>&1 >/dev/null
        && alembic upgrade head
      "

  contact-ops-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: contact-ops-backend
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      DATABASE_URL: postgresql+asyncpg://contact_ops_dev:dev@postgres:5432/contact_ops_db_dev
      STANDALONE_MODE: "true"
      ENV: dev
    depends_on:
      migration:
        condition: service_completed_successfully
    networks:
      - unicorn-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  contact-ops-frontend:
    image: nginx:alpine
    container_name: contact-ops-frontend
    restart: unless-stopped
    ports:
      - "8502:80"
    volumes:
      - ./frontend/build:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - unicorn-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'

  # Phase 3.0: Celery worker pool for the agent fleet.
  # Shares the backend image so it has the same Python + deps; runs the
  # ``contact_ops.agents.runtime:celery_app`` task surface.
  contact-ops-celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: contact-ops-celery-worker
    restart: unless-stopped
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://contact_ops_dev:dev@postgres:5432/contact_ops_db_dev
      REDIS_URL: redis://redis:6379/5
      CONTACT_OPS_AGENTS_BROKER_URL: redis://redis:6379/9
      OTEL_EXPORTER_OTLP_ENDPOINT: http://contact-ops-laminar:4317
      STANDALONE_MODE: "true"
      ENV: dev
    command:
      - celery
      - "-A"
      - contact_ops.agents.runtime
      - worker
      - "--loglevel=info"
      - "-Q"
      - "agents.batch.high,agents.batch.low,agents.calibration"
      - "--concurrency=2"
    networks:
      - unicorn-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # Phase 3.0: Celery beat scheduler. Computes the per-agent cron schedule
  # from the in-process registry; restart on each deploy.
  contact-ops-celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: contact-ops-celery-beat
    restart: unless-stopped
    depends_on:
      contact-ops-celery-worker:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://contact_ops_dev:dev@postgres:5432/contact_ops_db_dev
      REDIS_URL: redis://redis:6379/5
      CONTACT_OPS_AGENTS_BROKER_URL: redis://redis:6379/9
      STANDALONE_MODE: "true"
      ENV: dev
    command:
      - celery
      - "-A"
      - contact_ops.agents.runtime
      - beat
      - "--loglevel=info"
    networks:
      - unicorn-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  # Phase 3.0: Laminar self-hosted OTel collector. Apache-2.0, OTel-native,
  # GenAI semantic-convention aware. Profile-gated so docker compose up by
  # default doesn't pull a 1GB+ image; bring it online with
  # ``docker compose --profile observability up``.
  contact-ops-laminar:
    image: laminarflow/laminar:latest
    container_name: contact-ops-laminar
    restart: unless-stopped
    profiles:
      - observability
    ports:
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
      - "5667:5667"  # Laminar web UI
    environment:
      LAMINAR_DB_URL: ${CONTACT_OPS_DATABASE_URL}
    networks:
      - unicorn-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'

networks:
  unicorn-network:
    external: true

volumes:
  contact-ops-pgdata:
  contact-ops-redisdata:
